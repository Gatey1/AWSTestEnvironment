<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 640" width="1144" height="640" role="img" aria-label="Architecture: visitors reach an EC2 web server in a public subnet through the internet gateway on port 80. The web server queries an RDS PostgreSQL database in a private subnet over TLS on port 5432. The private subnets have no internet route. The web server calls Secrets Manager, SSM Session Manager and CloudWatch Logs; a CloudWatch alarm on failed logins notifies an SNS topic that emails the administrator.">
    <style>
svg{--bg:#ffffff;--ink:#0b0d12;--muted:#4a5163;--accent:#1240e0;--card:#ffffff;--vpc:#fafbff;--pub:#eef2ff;--pubs:#9fb0f5;--pri:#f2f2f5;--pris:#a2a3ad}
@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--ink:#e8ebf5;--muted:#a3abc2;--accent:#7d97ff;--card:#0f1322;--vpc:#0e1326;--pub:#16204a;--pubs:#3c52b0;--pri:#171a24;--pris:#4a4f62}}
.bgr{fill:var(--bg)}
text{font:12px "Segoe UI",Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:var(--ink)}
.t{font-weight:600;font-size:13px}
.s{font-size:11px;fill:var(--muted)}
.z{font-weight:600;font-size:12px;fill:var(--muted)}
.la{font-weight:600;font-size:11px;fill:var(--accent);paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.lb{font-size:11px;fill:var(--ink);paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.hb{stroke:var(--bg)}.hv{stroke:var(--vpc)}.hp{stroke:var(--pub)}
.region{fill:none;stroke:var(--muted);stroke-dasharray:6 4}
.vpc{fill:var(--vpc);stroke:var(--ink);stroke-width:1.2}
.pub{fill:var(--pub);stroke:var(--pubs)}
.pri{fill:var(--pri);stroke:var(--pris)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1.2}
.acc{fill:var(--card);stroke:var(--accent);stroke-width:2}
.ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.lnA{stroke:var(--accent);stroke-width:2.2;fill:none}
.mk{fill:var(--ink)}.mkA{fill:var(--accent)}
</style>
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker>
      <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mkA" d="M0 0L10 5L0 10z"/></marker>
    </defs>
    <rect class="bgr" width="1144" height="640"/>

    <!-- region and VPC -->
    <rect class="region" x="176" y="16" width="800" height="608" rx="8"/>
    <text class="z" x="192" y="40">AWS region ap-southeast-2</text>
    <rect class="vpc" x="200" y="56" width="464" height="548" rx="6"/>
    <text class="t" x="216" y="82">VPC · 2 Availability Zones</text>

    <!-- public subnets -->
    <rect class="pub" x="252" y="96" width="196" height="220" rx="4"/>
    <text class="z" x="264" y="116">Public subnet · AZ a</text>
    <rect class="pub" x="460" y="96" width="192" height="220" rx="4"/>
    <text class="z" x="472" y="116">Public subnet · AZ b</text>
    <text class="s" x="556" y="258" text-anchor="middle">Public route table</text>
    <text class="s" x="556" y="276" text-anchor="middle">0.0.0.0/0 → internet gateway</text>

    <!-- private subnets -->
    <rect class="pri" x="252" y="352" width="196" height="236" rx="4"/>
    <text class="z" x="264" y="372">Private subnet · AZ a</text>
    <rect class="pri" x="460" y="352" width="192" height="236" rx="4"/>
    <text class="z" x="472" y="372">Private subnet · AZ b</text>
    <text class="s" x="556" y="460" text-anchor="middle">Private route table: local only</text>
    <text class="s" x="556" y="478" text-anchor="middle">no route to or from the internet</text>
    <text class="s" x="556" y="512" text-anchor="middle">DB subnet group</text>
    <text class="s" x="556" y="530" text-anchor="middle">spans both private subnets</text>

    <!-- visitors and internet gateway -->
    <rect class="node" x="16" y="140" width="100" height="70" rx="6"/>
    <text class="t" x="66" y="170" text-anchor="middle">Visitors</text>
    <text class="s" x="66" y="188" text-anchor="middle">web browser</text>
    <rect class="acc" x="180" y="150" width="44" height="50" rx="4"/>
    <text class="t" x="202" y="180" text-anchor="middle">IGW</text>

    <!-- web server -->
    <rect class="acc" x="268" y="146" width="164" height="146" rx="6"/>
    <text class="t" x="280" y="168">EC2 web server</text>
    <text class="s" x="280" y="186">t3.micro · Amazon Linux</text>
    <text x="280" y="206">nginx :80</text>
    <text x="280" y="222">→ gunicorn → Flask</text>
    <text x="280" y="242">CloudWatch agent</text>
    <text class="s" x="280" y="262">web-sg: port 80 in</text>
    <text class="s" x="280" y="280">IAM role · IMDSv2</text>

    <!-- database -->
    <ellipse class="acc" cx="350" cy="416" rx="82" ry="12"/>
    <path class="acc" d="M268 416v120a82 12 0 0 0 164 0v-120"/>
    <ellipse class="acc" cx="350" cy="416" rx="82" ry="12"/>
    <text class="t" x="350" y="452" text-anchor="middle">RDS PostgreSQL 17</text>
    <text class="s" x="350" y="470" text-anchor="middle">db.t4g.micro</text>
    <text x="350" y="490" text-anchor="middle">public access: No</text>
    <text class="s" x="350" y="508" text-anchor="middle">db-sg: from web-sg only</text>
    <text class="s" x="350" y="526" text-anchor="middle">storage encrypted</text>

    <!-- request path -->
    <line class="lnA" x1="116" y1="175" x2="178" y2="175" marker-end="url(#arA)"/>
    <text class="la hb" x="148" y="165" text-anchor="middle">HTTP :80</text>
    <line class="lnA" x1="224" y1="175" x2="266" y2="175" marker-end="url(#arA)"/>
    <line class="lnA" x1="350" y1="292" x2="350" y2="402" marker-end="url(#arA)"/>
    <text class="la hv" x="360" y="338">SQL over TLS :5432</text>

    <!-- calls to AWS APIs -->
    <polyline class="ln" points="432,200 680,200"/>
    <text class="lb hp" x="556" y="192" text-anchor="middle">HTTPS to AWS APIs</text>
    <line class="ln" x1="680" y1="100" x2="680" y2="301"/>
    <line class="ln" x1="680" y1="100" x2="698" y2="100" marker-end="url(#ar)"/>
    <line class="ln" x1="680" y1="190" x2="698" y2="190" marker-end="url(#ar)"/>
    <line class="ln" x1="680" y1="301" x2="698" y2="301" marker-end="url(#ar)"/>

    <!-- regional services -->
    <text class="z" x="700" y="62">Regional services, outside the VPC</text>
    <rect class="node" x="700" y="70" width="250" height="60" rx="6"/>
    <text class="t" x="714" y="94">Secrets Manager</text>
    <text class="s" x="714" y="114">DB password, rotated every 7 days</text>
    <rect class="node" x="700" y="160" width="250" height="60" rx="6"/>
    <text class="t" x="714" y="184">SSM Session Manager</text>
    <text class="s" x="714" y="204">admin shell, no SSH or port 22</text>
    <rect class="node" x="700" y="262" width="250" height="78" rx="6"/>
    <text class="t" x="714" y="286">CloudWatch Logs</text>
    <text class="s" x="714" y="306">/webtest/access: every request</text>
    <text class="s" x="714" y="324">/webtest/auth: logins and sign-ups</text>
    <line class="ln" x1="825" y1="340" x2="825" y2="380" marker-end="url(#ar)"/>
    <text class="lb hb" x="835" y="364">metric filters</text>
    <rect class="node" x="700" y="382" width="250" height="60" rx="6"/>
    <text class="t" x="714" y="406">CloudWatch alarm</text>
    <text class="s" x="714" y="426">FailedLogins ≥ 5 in 5 minutes</text>
    <line class="ln" x1="825" y1="442" x2="825" y2="482" marker-end="url(#ar)"/>
    <text class="lb hb" x="835" y="466">notifies</text>
    <rect class="node" x="700" y="484" width="250" height="60" rx="6"/>
    <text class="t" x="714" y="508">SNS topic</text>
    <text class="s" x="714" y="528">email subscription</text>

    <!-- administrator -->
    <rect class="node" x="1000" y="160" width="128" height="60" rx="6"/>
    <text class="t" x="1064" y="184" text-anchor="middle">Administrator</text>
    <text class="s" x="1064" y="204" text-anchor="middle">AWS console</text>
    <line class="ln" x1="1000" y1="190" x2="952" y2="190" marker-end="url(#ar)"/>
    <text class="lb hb" x="976" y="180" text-anchor="middle">shell</text>
    <rect class="node" x="1000" y="484" width="128" height="60" rx="6"/>
    <text class="t" x="1064" y="508" text-anchor="middle">Inbox</text>
    <text class="s" x="1064" y="528" text-anchor="middle">alert email</text>
    <line class="ln" x1="950" y1="514" x2="998" y2="514" marker-end="url(#ar)"/>
  </svg>
